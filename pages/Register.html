<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="styles/register.css">
</head>

<body>
    <div class="containerLogin">
        <div class="containerInfo">
            <div class="containerCenterInfo">
                <h1 class="titleLogin">Crear usuario</h1>
                <p class="textSmallLogin">Te damos la bienvenida a People Counter</p>
                <p class="textSmallLogin">Si el usuario o contraseña estan mal, no seras redirigido</p>
                <div class="inputsButton">
                    <div class="containerInput">
                        <form action="/registro" id="registerForm" method="post" class="formulario">
                            <label for="name" class="labelInput1">Name</label>
                            <input type="text" id="name" name="name" class="inputData" placeholder="Arturo">
                            <label for="email" class="labelInput2">EMAIL </label>
                            <input type="text" id="email" name="email" class="inputData" placeholder="Arturo@gmail.com">
                            <label for="password" class="labelInput3">PASSWORD</label>
                            <input type="password" id="password" name="password" class="inputData"
                                placeholder="********">
                            <div class="containerLoginCreate">
                                <button type="submit" class="buttonLogin">Aceptar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <!--    <p>© 2021. - 2025 Todos Los Derechos Reservados Por Tecnológico de Pachuca</p>-->
        </footer>

    </div>
</body>

</html>
