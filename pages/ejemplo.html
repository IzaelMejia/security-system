<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <link rel="stylesheet" href="styles/reportes.css">
</head>
<body>
    <div class="contenedorGenerador" id="calendario">
        <div class="contenedorCalendario">
            <input type="text" id="rangoFechas" placeholder="Selecciona fecha">
        </div>
        <div class="rangoHoras">
            <input type="text" id="horaInicio" placeholder="Hora de inicio">
            <input type="text" id="horaFin" placeholder="Hora de fin">
        </div>
        <button class="botonGeneraReporte" id="mostrarRango">Aceptar</button>
        <p id="rangoSeleccionado"></p>
    </div>

    <script src="../scripts/fechaReporte.js"></script>
   
</body>
</html>
