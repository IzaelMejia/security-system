<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/styles/login.css">
</head>
<body>

    <div class="containerLogin">
        <div class="containerInfo">
            <div class="containerCenterInfo">
                    <h1 class="titleLogin">Inicia Sesión</h1>
                    <p class="textSmallLogin">Te damos la bienvenida a People Counter</p>
                <div class="inputsButton">
                    <form action="/" method="POST"> <!-- Añadido formulario y acción -->
                        <div class="containerInput">
                            <label for="username" class="labelInput">EMAIL ADDRESS</label>
                            <input type="text" id="username" name="username" class="inputData" placeholder="izaelmejiaa@gmail.com">
                        </div>
                        <div class="containerInput containerInputSpace">
                            <label for="password" class="labelInput">PASSWORD</label>
                            <input type="password" id="password" name="password" class="inputData" placeholder="********">
                        </div>
                            <div class="remember">
                            <div>
                                <label for="remember" class="lebelRemember">Recuérdame</label>
                                <input type="checkbox" id="remember" name="remember">
                            </div>
                            <label for="forgot" class="lebelRemember labelRememberPassword">¿Olvidaste tu contraseña?</label>
                        </div>
                        
                        <div class="containerLoginCreate">
                            <label for="createCount" class="labelCreateCount" id="crearCuentaLabel">Crear cuenta</label>
                            <button type="submit" class="buttonLogin">Aceptar</button>
                        </div>
                    </form> <!-- Cierre del formulario -->
                </div>
            </div>
        </div>
        
        <footer>
            <p class="">© 2021. - 2025 Todos Los Derechos Reservados Por Tecnológico de Pachuca</p>
        </footer>
        
    </div>

<!-- script Pasar de Inicio de sesión a Registro -->
    <script>
        document.getElementById('crearCuentaLabel').addEventListener('click', function () {
            window.location.href = '/registro';
        });
    </script>
    
</body>
</html>
